
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexora Store</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h2>NEXORA<span>STORE.</span></h2>
    <p>Belanja mudah, cepat, dan terpercaya.</p>
</header>

<section class="hero">
    <h1>Temukan Produk Favoritmu</h1>
    <p>Produk pilihan dengan harga terbaik.</p>
    <a href="#produk" class="btn">Lihat Produk</a>
</section>

<section class="container" id="produk">
    <h2>Katalog Produk</h2>

    <input
        type="text"
        id="search"
        placeholder="Cari produk..."
    >

    <div class="products" id="product-list"></div>
</section>

<footer>
    <h3>NEXORA STORE</h3>
    <p>Terima kasih sudah berkunjung!</p>
    <p>© 2026 Nexora Store</p>
</footer>

<script src="script.js"></script>
</body>
</html>
